<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-7a2a6d04-e9d1-44d1-9b96-d3c95af5eabd/styles.css">
  <script src="_ds/modernist-7a2a6d04-e9d1-44d1-9b96-d3c95af5eabd/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Readex+Pro:wght@300;400;500;600;700&family=Archivo:wght@500;600;800&display=swap">
  <style>
    :root{
      --brand-ink:#232f47; --brand-amber:#e8a12a; --brand-amber-deep:#8a5c07;
      --gut:32px; --paper:#f4f3f1; --paper-2:#ebe9e6; --rule:#232f47;
      --font-ar:"Almarai", system-ui, sans-serif; --font-head:"Readex Pro","Almarai",sans-serif;
    }
    html,body{margin:0;background:var(--paper);}
    body{font-family:var(--font-ar);color:var(--brand-ink);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;}
    h1,h2,h3,h4,h5,h6{font-family:var(--font-head);font-weight:600;letter-spacing:-.015em;line-height:1.24;margin:0;}
    blockquote{font-family:var(--font-head);margin:0;}
    a{color:var(--brand-ink);text-decoration:none;}
    a:hover{color:var(--brand-amber-deep);}
    .lat{font-family:"Archivo",sans-serif;font-weight:600;font-feature-settings:"tnum" 1;direction:ltr;unicode-bidi:isolate;}
    ::selection{background:color-mix(in srgb,var(--brand-amber) 45%, transparent);}
    :focus-visible{outline:2px solid var(--brand-amber);outline-offset:2px;}
    @media (max-width:1180px){:root{--gut:24px}[data-g="split"]{grid-template-columns:minmax(0,1fr)!important;gap:36px!important}}
    @media (max-width:980px){
      [data-g="g3"],[data-g="g4"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}
      [data-g="rowB"]{grid-template-columns:180px minmax(0,1fr)!important}
      [data-g="share"]{position:static!important;flex-direction:row!important;width:auto!important;border-right:0!important;padding:0 0 20px!important}
      [data-g="artgrid"]{grid-template-columns:minmax(0,1fr)!important;gap:0!important}
    }
    @media (max-width:680px){
      :root{--gut:16px}
      [data-g="g3"],[data-g="g4"],[data-g="g2"]{grid-template-columns:minmax(0,1fr)!important}
      [data-g="rowB"]{grid-template-columns:minmax(0,1fr)!important;gap:14px!important}
      [data-g="hero-title"]{font-size:clamp(26px,7vw,34px)!important}
    }
  </style>
</helmet>
<div dir="rtl" style="background:var(--paper);min-height:100vh;overflow-x:hidden">
<dc-import name="Site Header" active="مرئيات" hint-size="100%,150px"></dc-import>
  <section style="background:#12182a;color:#f4f3f1">
    <div style="max-width:1400px;margin:0 auto;padding:40px var(--gut) 48px">
      <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:22px;border-bottom:1px solid rgba(244,243,241,.22);padding-bottom:20px">
        <div>
          <span style="font-size:12px;font-weight:700;color:var(--brand-amber)">قناة الجرمق</span>
          <h1 style="color:#fff;font-size:clamp(30px,4vw,52px);margin-top:10px">أرشيف المرئيات</h1>
        </div>
        <div style="display:flex;gap:2px">
          <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
            <button onClick="{{ f.on }}" style="border:1px solid rgba(244,243,241,.3);background:{{ f.bg }};color:{{ f.fg }};font-family:var(--font-ar);font-size:13px;font-weight:600;padding:9px 15px;cursor:pointer">{{ f.label }}</button>
          </sc-for>
        </div>
      </div>
      <div data-g="split" style="display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:28px;align-items:start;padding-top:28px">
        <div>
          <div style="position:relative;aspect-ratio:16/9;background:#000;overflow:hidden">
            <img src="{{ vPoster }}" alt="" style="width:100%;height:100%;object-fit:cover">
            <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9) 6%,rgba(0,0,0,.25) 50%,rgba(0,0,0,.05));pointer-events:none"></div>
            <span style="position:absolute;top:18px;right:18px;background:#ec3013;color:#fff;font-size:11.5px;font-weight:700;padding:4px 9px">{{ vKicker }}</span>
            <sc-if value="{{ notPlaying }}" hint-placeholder-val="{{ true }}">
              <button onClick="{{ togglePlay }}" style="position:absolute;inset:0;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:#fff" aria-label="تشغيل">
                <span style="width:84px;height:84px;border:2px solid #fff;background:rgba(255,255,255,.14);display:grid;place-items:center" style-hover="background:var(--brand-amber);border-color:var(--brand-amber);color:var(--brand-ink)"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="margin-right:3px"><path d="m7 3 14 9-14 9V3z"></path></svg></span>
              </button>
            </sc-if>
            <div style="position:absolute;inset:auto 22px 64px 22px;pointer-events:none"><h2 style="color:#fff;font-size:clamp(20px,2.2vw,30px);max-width:26ch;line-height:1.32">{{ vTitle }}</h2></div>
            <div style="position:absolute;inset:auto 0 0 0;padding:0 18px 14px;display:flex;flex-direction:column;gap:9px">
              <div onClick="{{ seek }}" style="position:relative;height:14px;display:flex;align-items:center;cursor:pointer">
                <div style="position:absolute;inset:6px 0;background:rgba(255,255,255,.28)"></div>
                <div style="position:absolute;top:6px;bottom:6px;right:0;background:var(--brand-amber);{{ vProgress }}"></div>
              </div>
              <div style="display:flex;align-items:center;gap:14px;color:#fff">
                <button onClick="{{ togglePlay }}" style="width:34px;height:34px;border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center" style-hover="background:var(--brand-amber);color:var(--brand-ink)" aria-label="تشغيل/إيقاف">
                  <sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg></sc-if>
                  <sc-if value="{{ notPlaying }}" hint-placeholder-val="{{ true }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="m7 3 14 9-14 9V3z"></path></svg></sc-if>
                </button>
                <span class="lat" style="font-size:12.5px">{{ vElapsed }} / {{ vDur }}</span>
                <span style="flex:1"></span>
                <span style="font-size:12.5px;opacity:.75">{{ vViews }} مشاهدة</span>
              </div>
            </div>
          </div>
        </div>
        <div style="border:1px solid rgba(244,243,241,.22);display:flex;flex-direction:column">
          <div style="padding:15px 18px;border-bottom:1px solid rgba(244,243,241,.22);display:flex;align-items:center;justify-content:space-between"><h3 style="color:#fff;font-size:16px">قائمة التشغيل</h3><span style="font-size:11.5px;color:var(--brand-amber);font-weight:700">6 مواد</span></div>
          <sc-for list="{{ playlist }}" as="v" hint-placeholder-count="6">
            <button onClick="{{ v.on }}" style="display:grid;grid-template-columns:92px 1fr;gap:13px;align-items:center;text-align:right;padding:11px 13px;border:0;border-bottom:1px solid rgba(244,243,241,.14);background:{{ v.bg }};color:#f4f3f1;font-family:var(--font-ar);cursor:pointer" style-hover="background:rgba(244,243,241,.08)">
              <div style="position:relative;aspect-ratio:16/10;overflow:hidden">
                <img src="{{ v.thumb }}" alt="" style="width:100%;height:100%;object-fit:cover">
                <span class="lat" style="position:absolute;bottom:0;right:0;background:rgba(0,0,0,.72);color:#fff;font-size:10.5px;padding:2px 5px">{{ v.dur }}</span>
              </div>
              <div><div style="font-size:11.5px;color:var(--brand-amber);font-weight:700;margin-bottom:4px">{{ v.kicker }}</div><div style="font-size:14.5px;font-weight:600;line-height:1.45">{{ v.title }}</div></div>
            </button>
          </sc-for>
        </div>
      </div>
    </div>
  </section>
  <section style="max-width:1400px;margin:56px auto 72px;padding:0 var(--gut)">
    <div style="border-top:2px solid var(--rule);padding-top:20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px">
      <h2 style="font-size:clamp(22px,2.6vw,32px)">كل المرئيات</h2>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px">
        <div style="display:flex;align-items:center;gap:9px;border:1px solid color-mix(in srgb,var(--brand-ink) 30%,transparent);padding:9px 13px;background:#fff">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <input value="{{ q }}" onChange="{{ setQ }}" placeholder="ابحث في المرئيات…" style="font-family:var(--font-ar);font-size:13.5px;border:0;outline:none;background:transparent;color:var(--brand-ink);width:180px">
        </div>
        <label style="display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600">
          <span style="color:color-mix(in srgb,var(--brand-ink) 60%,transparent)">ترتيب</span>
          <select value="{{ sort }}" onChange="{{ setSort }}" style="font-family:var(--font-ar);font-size:13.5px;font-weight:600;padding:9px 14px 9px 36px;border:1px solid color-mix(in srgb,var(--brand-ink) 30%,transparent);color:var(--brand-ink);outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;background-color:#fff;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2216%22%20height%3D%2216%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23232f47%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m6%209%206%206%206-6%22%2F%3E%3C%2Fsvg%3E');background-repeat:no-repeat;background-position:left 12px center">
            <sc-for list="{{ sortOpts }}" as="o" hint-placeholder-count="3"><option value="{{ o }}">{{ o }}</option></sc-for>
          </select>
        </label>
        <span style="font-size:13px;color:color-mix(in srgb,var(--brand-ink) 60%,transparent)">{{ shown }} مادة</span>
      </div>
    </div>
    <div data-g="g3" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:24px">
      <sc-for list="{{ grid }}" as="g" hint-placeholder-count="6">
        <button onClick="{{ g.on }}" style="text-align:right;border:0;background:transparent;padding:0;cursor:pointer;font-family:var(--font-ar);color:var(--brand-ink);display:block;border-top:2px solid var(--rule);padding-top:14px" style-hover="border-top-color:var(--brand-amber)">
          <div style="position:relative;aspect-ratio:16/9;overflow:hidden;margin-bottom:13px">
            <img src="{{ g.thumb }}" alt="" style="width:100%;height:100%;object-fit:cover">
            <span style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,24,42,.18)"><span style="width:48px;height:48px;border:2px solid #fff;display:grid;place-items:center;color:#fff"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" style="margin-right:2px"><path d="m7 3 14 9-14 9V3z"></path></svg></span></span>
            <span class="lat" style="position:absolute;bottom:0;right:0;background:rgba(0,0,0,.72);color:#fff;font-size:11px;padding:3px 7px">{{ g.dur }}</span>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px"><span style="font-size:11.5px;font-weight:700;color:var(--brand-amber-deep)">{{ g.kicker }}</span><span style="font-size:11.5px;opacity:.55">{{ g.views }} مشاهدة</span></div>
          <h3 style="font-size:18px;line-height:1.45">{{ g.title }}</h3>
        </button>
      </sc-for>
    </div>
  </section>
<dc-import name="Site Footer" hint-size="100%,520px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { i: 0, playing: false, t: 0, f: 0, q: '', sort: 'الأحدث' };
  vids = [
    { kicker: 'فيلم وثائقي', title: '«على حدود الخط الأخضر» — فيلم قصير من إنتاج الجرمق', dur: '12:40', secs: 760, views: '147 ألف', file: 'https://commons.wikimedia.org/wiki/Special:FilePath/PikiWiki_Israel_28738_Mount_of_Precipice.JPG?width=1400' },
    { kicker: 'تقرير مصوّر', title: 'جولة في سوق الناصرة القديم قبل ساعة الإغلاق', dur: '04:12', secs: 252, views: '62 ألف', file: 'https://commons.wikimedia.org/wiki/Special:FilePath/White_Mosque_Nazareth_017.JPG?width=1400' },
    { kicker: 'مقابلة', title: 'رئيس لجنة المتابعة يردّ على أسئلة الجرمق', dur: '09:58', secs: 598, views: '88 ألف', file: 'https://commons.wikimedia.org/wiki/Special:FilePath/2011-08_Nazaret_Geb%C3%A4ude.jpg?width=1400' },
    { kicker: 'شرح', title: 'كيف تُقرأ خرائط التخطيط؟ دليل مبسّط في ست دقائق', dur: '06:31', secs: 391, views: '41 ألف', file: 'https://commons.wikimedia.org/wiki/Special:FilePath/PikiWiki_Israel_32275_Shaab_in_Lower_Galilee.jpg?width=1400' },
    { kicker: 'تقرير مصوّر', title: 'موسم الزيتون: يوم كامل مع عائلة في دير حنا', dur: '07:45', secs: 465, views: '73 ألف', file: 'https://commons.wikimedia.org/wiki/Special:FilePath/Olive_harvesting.jpg?width=1400' },
    { kicker: 'مقابلة', title: 'مهندسة تخطيط تشرح ماذا يعني «حرم بيئي»', dur: '05:18', secs: 318, views: '29 ألف', file: 'https://commons.wikimedia.org/wiki/Special:FilePath/116990_birya_in_the_upper_galilee_PikiWiki_Israel.jpg?width=1400' }
  ];
  fmt(s) { const m = Math.floor(s / 60), r = Math.floor(s % 60); return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0'); }
  tick = () => { const v = this.vids[this.state.i]; this.setState(s => ({ t: s.t + 1 >= v.secs ? 0 : s.t + 1 })); };
  toggle = () => { if (this.state.playing) { clearInterval(this._iv); this.setState({ playing: false }); } else { this._iv = setInterval(this.tick, 1000); this.setState({ playing: true }); } };
  componentWillUnmount() { clearInterval(this._iv); }
  renderVals() {
    const v = this.vids[this.state.i];
    const fl = ['الكل', 'أفلام وثائقية', 'مقابلات', 'تقارير مصوّرة'];
    const q = this.state.q.trim();
    const list = q ? this.vids.filter(x => x.title.includes(q) || x.kicker.includes(q)) : this.vids;
    return {
      q: this.state.q, sort: this.state.sort,
      sortOpts: ['الأحدث', 'الأكثر مشاهدة', 'الأطول', 'الأقصر'],
      setQ: (e) => this.setState({ q: e.target.value }),
      setSort: (e) => this.setState({ sort: e.target.value }),
      shown: String(list.length),
      vPoster: v.file, vKicker: v.kicker, vTitle: v.title, vDur: v.dur, vViews: v.views,
      vElapsed: this.fmt(this.state.t),
      vProgress: 'width:' + (this.state.t / v.secs * 100).toFixed(2) + '%',
      playing: this.state.playing, notPlaying: !this.state.playing,
      togglePlay: this.toggle,
      seek: (e) => { const b = e.currentTarget.getBoundingClientRect(); const p = Math.min(1, Math.max(0, (b.right - e.clientX) / b.width)); this.setState({ t: Math.round(p * v.secs) }); },
      filters: fl.map((label, i) => ({ label, on: () => this.setState({ f: i }), bg: i === this.state.f ? 'var(--brand-amber)' : 'transparent', fg: i === this.state.f ? '#232f47' : '#f4f3f1' })),
      playlist: this.vids.map((x, i) => ({ ...x, thumb: x.file, bg: i === this.state.i ? 'rgba(232,161,42,.16)' : 'transparent', on: () => this.setState({ i, t: 0 }) })),
      grid: list.map((x) => ({ ...x, thumb: x.file, i: this.vids.indexOf(x) })).map((x) => ({ ...x, on: () => { this.setState({ i: x.i, t: 0 }); window.scrollTo({ top: 0, behavior: 'smooth' }); } }))
    };
  }
}
</script>
</body>
</html>
