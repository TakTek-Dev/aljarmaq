<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-7a2a6d04-e9d1-44d1-9b96-d3c95af5eabd/styles.css">
  <script src="_ds/modernist-7a2a6d04-e9d1-44d1-9b96-d3c95af5eabd/_ds_bundle.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Readex+Pro:wght@300;400;500;600;700&family=Archivo:wght@500;600;800&display=swap">
  <style>
    :root{
      --brand-ink:#232f47; --brand-amber:#e8a12a; --brand-amber-deep:#8a5c07;
      --gut:32px; --paper:#f4f3f1; --paper-2:#ebe9e6; --rule:#232f47;
      --font-ar:"Almarai", system-ui, sans-serif; --font-head:"Readex Pro","Almarai",sans-serif;
    }
    .lat{font-family:"Archivo",sans-serif;font-weight:600;font-feature-settings:"tnum" 1;direction:ltr;unicode-bidi:isolate;}
    @media (max-width:980px){
      [data-g="nav"]{display:none!important}
      [data-g="hdr"]{grid-template-columns:auto auto!important;justify-content:space-between;gap:16px!important;padding-top:14px!important;padding-bottom:14px!important}
      [data-g="burger"]{display:grid!important}
      [data-g="hdr-cta"]{display:none!important}
      [data-g="logo"]{height:40px!important}
      [data-g="topbar-side"] > span:first-child,[data-g="topbar-side"] > span:nth-child(2){display:none}
    }
    @media (max-width:680px){
      :root{--gut:16px}
      [data-g="topbar"]{height:auto!important;padding-top:8px!important;padding-bottom:8px!important;font-size:11.5px!important}
      [data-g="topbar-side"]{display:none!important}
    }
  </style>
</helmet>
<div dir="rtl" style="font-family:var(--font-ar);color:var(--brand-ink)">
  <div style="background:var(--brand-ink);color:#f4f3f1">
    <div data-g="topbar" style="max-width:1400px;margin:0 auto;padding:0 var(--gut);display:flex;align-items:center;justify-content:space-between;gap:24px;height:38px;font-size:12px">
      <div style="display:flex;align-items:center;gap:18px">
        <span style="display:flex;align-items:center;gap:7px;color:var(--brand-amber);font-weight:600"><span style="width:6px;height:6px;background:var(--brand-amber);display:block"></span>بث مباشر</span>
        <span style="opacity:.65">الثلاثاء 28 تموز 2026 — 13 صفر 1448</span>
      </div>
      <div data-g="topbar-side" style="display:flex;align-items:center;gap:20px;opacity:.8">
        <span>الناصرة 31°</span><span style="width:1px;height:14px;background:rgba(255,255,255,.25)"></span>
        <span>تواصل معنا</span>
      </div>
    </div>
  </div>

  <header style="border-bottom:2px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:40">
    <div data-g="hdr" style="max-width:1400px;margin:0 auto;padding:18px var(--gut);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:32px">
      <a href="Aljarmaq Home.dc.html" style="display:block"><img data-g="logo" src="assets/logo.png" alt="الجرمق الاخباري" style="height:46px;width:auto"></a>
      <nav data-g="nav" style="display:flex;flex-wrap:wrap;gap:26px;justify-content:center;font-size:15px;font-weight:600">
        <sc-for list="{{ navLinks }}" as="l" hint-placeholder-count="6">
          <a href="{{ l.href }}" style="padding-bottom:3px;border-bottom:2px solid {{ l.line }};color:{{ l.color }};text-decoration:none" style-hover="border-bottom-color:var(--brand-amber)">{{ l.label }}</a>
        </sc-for>
      </nav>
      <div style="display:flex;align-items:center;gap:10px">
        <button style="width:40px;height:40px;border:2px solid var(--rule);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--brand-ink)" style-hover="background:var(--brand-ink);color:var(--paper)" aria-label="بحث">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        </button>
        <button data-g="burger" onClick="{{ openMenu }}" style="display:none;width:40px;height:40px;border:2px solid var(--rule);background:transparent;cursor:pointer;place-items:center;color:var(--brand-ink)" style-hover="background:var(--brand-ink);color:var(--paper)" aria-label="القائمة">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
        </button>
        <a data-g="hdr-cta" href="Aljarmaq Home.dc.html#newsletter" style="display:flex;align-items:center;gap:8px;background:var(--brand-ink);color:var(--paper);padding:11px 20px;font-size:14px;font-weight:600;text-decoration:none" style-hover="background:var(--brand-amber);color:var(--brand-ink)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4"></rect><path d="m2 7 10 6 10-6"></path></svg><span>اشترك في النشرة</span>
        </a>
      </div>
    </div>
  </header>

  <div onClick="{{ closeMenu }}" style="position:fixed;inset:0;background:rgba(18,24,42,.55);z-index:60;transition:opacity .25s ease;{{ scrimStyle }}"></div>
  <aside style="position:fixed;top:0;bottom:0;right:0;width:min(86vw,340px);background:var(--paper);border-left:2px solid var(--rule);z-index:61;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.22,.61,.36,1),visibility .3s;{{ drawerStyle }}">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:2px solid var(--rule)">
      <img src="assets/logo.png" alt="الجرمق الاخباري" style="height:34px;width:auto">
      <button onClick="{{ closeMenu }}" style="width:38px;height:38px;border:2px solid var(--rule);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--brand-ink)" style-hover="background:var(--brand-ink);color:var(--paper)" aria-label="إغلاق">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </button>
    </div>
    <div style="display:flex;flex-direction:column;overflow-y:auto;flex:1">
      <sc-for list="{{ menuLinks }}" as="l" hint-placeholder-count="7">
        <a href="{{ l.href }}" onClick="{{ closeMenu }}" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 20px;font-size:17px;font-weight:600;text-decoration:none;color:var(--brand-ink);border-bottom:1px solid color-mix(in srgb,var(--brand-ink) 18%,transparent)" style-hover="background:var(--paper-2);color:var(--brand-amber-deep)">
          <span>{{ l.label }}</span>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
        </a>
      </sc-for>
    </div>
    <div style="padding:18px 20px;border-top:2px solid var(--rule)">
      <a href="Aljarmaq Home.dc.html#newsletter" onClick="{{ closeMenu }}" style="display:flex;align-items:center;justify-content:center;gap:9px;background:var(--brand-ink);color:var(--paper);padding:14px;font-size:15px;font-weight:700;text-decoration:none" style-hover="background:var(--brand-amber);color:var(--brand-ink)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4"></rect><path d="m2 7 10 6 10-6"></path></svg><span>اشترك في النشرة</span>
      </a>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;الرئيسية&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false };
  renderVals() {
    const open = this.state.menuOpen;
    const active = this.props.active || '';
    const links = [
      { label: 'الرئيسية', href: 'Aljarmaq Home.dc.html' },
      { label: 'محليات', href: 'Aljarmaq Category.dc.html' },
      { label: 'مقالات', href: 'Aljarmaq Author.dc.html' },
      { label: 'مرئيات', href: 'Aljarmaq Video Archive.dc.html' },
      { label: 'ألبومات', href: 'Aljarmaq Album.dc.html' },
      { label: 'مباشر', href: 'Aljarmaq Live.dc.html' },
      { label: 'من نحن', href: 'Aljarmaq About.dc.html' }
    ];
    return {
      navLinks: links.slice(0, 6).map(l => ({
        ...l,
        line: l.label === active ? 'var(--brand-amber)' : 'transparent',
        color: 'var(--brand-ink)'
      })),
      menuLinks: links,
      openMenu: () => this.setState({ menuOpen: true }),
      closeMenu: () => this.setState({ menuOpen: false }),
      drawerStyle: 'transform:translateX(' + (open ? '0' : '100%') + ');visibility:' + (open ? 'visible' : 'hidden'),
      scrimStyle: 'opacity:' + (open ? '1' : '0') + ';pointer-events:' + (open ? 'auto' : 'none')
    };
  }
}
</script>
</body>
</html>
