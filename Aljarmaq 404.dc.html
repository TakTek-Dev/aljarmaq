<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-7a2a6d04-e9d1-44d1-9b96-d3c95af5eabd/styles.css">
  <script src="_ds/modernist-7a2a6d04-e9d1-44d1-9b96-d3c95af5eabd/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Readex+Pro:wght@300;400;500;600;700&family=Archivo:wght@500;600;800&display=swap">
  <style>
    :root{
      --brand-ink:#232f47; --brand-amber:#e8a12a; --brand-amber-deep:#8a5c07;
      --gut:32px; --paper:#f4f3f1; --paper-2:#ebe9e6; --rule:#232f47;
      --font-ar:"Almarai", system-ui, sans-serif; --font-head:"Readex Pro","Almarai",sans-serif;
    }
    html,body{margin:0;background:var(--paper);}
    body{font-family:var(--font-ar);color:var(--brand-ink);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;}
    h1,h2,h3,h4,h5,h6{font-family:var(--font-head);font-weight:600;letter-spacing:-.015em;line-height:1.24;margin:0;}
    blockquote{font-family:var(--font-head);margin:0;}
    a{color:var(--brand-ink);text-decoration:none;}
    a:hover{color:var(--brand-amber-deep);}
    .lat{font-family:"Archivo",sans-serif;font-weight:600;font-feature-settings:"tnum" 1;direction:ltr;unicode-bidi:isolate;}
    ::selection{background:color-mix(in srgb,var(--brand-amber) 45%, transparent);}
    :focus-visible{outline:2px solid var(--brand-amber);outline-offset:2px;}
    @media (max-width:1180px){:root{--gut:24px}[data-g="split"]{grid-template-columns:minmax(0,1fr)!important;gap:36px!important}}
    @media (max-width:980px){
      [data-g="g3"],[data-g="g4"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}
      [data-g="rowB"]{grid-template-columns:180px minmax(0,1fr)!important}
      [data-g="share"]{position:static!important;flex-direction:row!important;width:auto!important;border-right:0!important;padding:0 0 20px!important}
      [data-g="artgrid"]{grid-template-columns:minmax(0,1fr)!important;gap:0!important}
    }
    @media (max-width:680px){
      :root{--gut:16px}
      [data-g="g3"],[data-g="g4"],[data-g="g2"]{grid-template-columns:minmax(0,1fr)!important}
      [data-g="rowB"]{grid-template-columns:minmax(0,1fr)!important;gap:14px!important}
      [data-g="hero-title"]{font-size:clamp(26px,7vw,34px)!important}
    }
  </style>
</helmet>
<div dir="rtl" style="background:var(--paper);min-height:100vh;overflow-x:hidden">
<dc-import name="Site Header" active="" hint-size="100%,150px"></dc-import>
  <section style="max-width:1400px;margin:0 auto;padding:0 var(--gut)">
    <div data-g="split" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:52px;align-items:center;padding:64px 0 56px;border-bottom:2px solid var(--rule)">
      <div>
        <span class="lat" style="font-size:clamp(90px,16vw,190px);line-height:.85;color:var(--brand-amber);display:block">404</span>
        <h1 style="font-size:clamp(26px,3.2vw,42px);margin:22px 0 14px;max-width:22ch">الصفحة اللي بتدوّر عليها مش موجودة</h1>
        <p style="margin:0 0 26px;font-size:17px;line-height:1.85;max-width:48ch;color:color-mix(in srgb,var(--brand-ink) 74%,transparent)">يمكن الرابط تغيّر، أو المادة انتقلت إلى الأرشيف. جرّب البحث، أو ابدأ من الصفحة الرئيسية.</p>
        <form onSubmit="{{ noSubmit }}" style="display:grid;grid-template-columns:1fr auto;max-width:460px">
          <input placeholder="ابحث في الأرشيف…" style="font-family:var(--font-ar);font-size:16px;padding:16px 18px;border:2px solid var(--rule);background:#fff;outline:none;color:var(--brand-ink)">
          <a href="Aljarmaq Search.dc.html" style="font-size:15px;font-weight:700;padding:16px 26px;background:var(--brand-ink);color:#fff;border:2px solid var(--rule);display:flex;align-items:center;gap:9px" style-hover="background:var(--brand-amber);color:var(--brand-ink)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><span>ابحث</span></a>
        </form>
        <div style="display:flex;flex-wrap:wrap;gap:2px;margin-top:26px">
          <a href="Aljarmaq Home.dc.html" style="border:2px solid var(--rule);padding:12px 20px;font-size:14px;font-weight:700" style-hover="background:var(--brand-ink);color:var(--paper)">الرئيسية</a>
          <a href="Aljarmaq Category.dc.html" style="border:2px solid var(--rule);padding:12px 20px;font-size:14px;font-weight:700" style-hover="background:var(--brand-ink);color:var(--paper)">محليات</a>
          <a href="Aljarmaq Live.dc.html" style="border:2px solid var(--rule);padding:12px 20px;font-size:14px;font-weight:700" style-hover="background:var(--brand-ink);color:var(--paper)">التغطيات المباشرة</a>
        </div>
      </div>
      <div style="aspect-ratio:4/3;overflow:hidden"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/PikiWiki_Israel_28738_Mount_of_Precipice.JPG?width=1400" alt="" style="width:100%;height:100%;object-fit:cover"></div>
    </div>
  </section>
  <section style="max-width:1400px;margin:44px auto 72px;padding:0 var(--gut)">
    <h2 style="font-size:22px;margin-bottom:22px">اقرأ بدلًا من ذلك</h2>
    <div data-g="g4" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px">
      <sc-for list="{{ picks }}" as="p" hint-placeholder-count="4">
        <a href="Aljarmaq Article.dc.html" style="display:block;border-top:2px solid var(--rule);padding-top:14px" style-hover="border-top-color:var(--brand-amber)">
          <div style="aspect-ratio:4/3;overflow:hidden;margin-bottom:13px"><img src="{{ p.img }}" alt="" style="width:100%;height:100%;object-fit:cover"></div>
          <span style="font-size:11.5px;font-weight:700;color:var(--brand-amber-deep)">{{ p.cat }}</span>
          <h3 style="font-size:18px;line-height:1.45;margin-top:7px">{{ p.title }}</h3>
        </a>
      </sc-for>
    </div>
  </section>
<dc-import name="Site Footer" hint-size="100%,520px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      noSubmit: (e) => e.preventDefault(),
      picks: [
        { img: 'https://commons.wikimedia.org/wiki/Special:FilePath/PikiWiki_Israel_32275_Shaab_in_Lower_Galilee.jpg?width=1400', cat: 'محليات', title: 'جلسة استماع في لجنة التخطيط تنتهي دون قرار' },
        { img: 'https://commons.wikimedia.org/wiki/Special:FilePath/2011-08_Nazaret_Geb%C3%A4ude.jpg?width=1400', cat: 'تعليم', title: 'ميزانية الترميم تصل 14 مدرسة فقط من أصل 40 طلبًا' },
        { img: 'https://commons.wikimedia.org/wiki/Special:FilePath/White_Mosque_Nazareth_017.JPG?width=1400', cat: 'اقتصاد', title: 'أسعار الخضار ترتفع 18% خلال أسبوعين' },
        { img: 'https://commons.wikimedia.org/wiki/Special:FilePath/Olive_harvesting.jpg?width=1400', cat: 'ألبوم', title: 'موسم الزيتون في دير حنا: يوم كامل بين الأشجار' }
      ]
    };
  }
}
</script>
</body>
</html>
