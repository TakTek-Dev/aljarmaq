<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-7a2a6d04-e9d1-44d1-9b96-d3c95af5eabd/styles.css">
  <script src="_ds/modernist-7a2a6d04-e9d1-44d1-9b96-d3c95af5eabd/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Readex+Pro:wght@300;400;500;600;700&family=Archivo:wght@500;600;800&display=swap">
  <style>
    :root{
      --brand-ink:#232f47; --brand-amber:#e8a12a; --brand-amber-deep:#8a5c07;
      --gut:32px; --paper:#f4f3f1; --paper-2:#ebe9e6; --rule:#232f47;
      --font-ar:"Almarai", system-ui, sans-serif; --font-head:"Readex Pro","Almarai",sans-serif;
    }
    html,body{margin:0;background:var(--paper);}
    body{font-family:var(--font-ar);color:var(--brand-ink);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;}
    h1,h2,h3,h4,h5,h6{font-family:var(--font-head);font-weight:600;letter-spacing:-.015em;line-height:1.24;margin:0;}
    blockquote{font-family:var(--font-head);margin:0;}
    a{color:var(--brand-ink);text-decoration:none;}
    a:hover{color:var(--brand-amber-deep);}
    .lat{font-family:"Archivo",sans-serif;font-weight:600;font-feature-settings:"tnum" 1;direction:ltr;unicode-bidi:isolate;}
    ::selection{background:color-mix(in srgb,var(--brand-amber) 45%, transparent);}
    :focus-visible{outline:2px solid var(--brand-amber);outline-offset:2px;}
    @media (max-width:1180px){:root{--gut:24px}[data-g="split"]{grid-template-columns:minmax(0,1fr)!important;gap:36px!important}}
    @media (max-width:980px){
      [data-g="g3"],[data-g="g4"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}
      [data-g="rowB"]{grid-template-columns:180px minmax(0,1fr)!important}
      [data-g="share"]{position:static!important;flex-direction:row!important;width:auto!important;border-right:0!important;padding:0 0 20px!important}
      [data-g="artgrid"]{grid-template-columns:minmax(0,1fr)!important;gap:0!important}
    }
    @media (max-width:680px){
      :root{--gut:16px}
      [data-g="g3"],[data-g="g4"],[data-g="g2"]{grid-template-columns:minmax(0,1fr)!important}
      [data-g="rowB"]{grid-template-columns:minmax(0,1fr)!important;gap:14px!important}
      [data-g="hero-title"]{font-size:clamp(26px,7vw,34px)!important}
    }
  </style>
</helmet>
<div dir="rtl" style="background:var(--paper);min-height:100vh;overflow-x:hidden">
<dc-import name="Site Header" active="محليات" hint-size="100%,150px"></dc-import>
  <div style="max-width:1400px;margin:0 auto;padding:18px var(--gut) 0;display:flex;align-items:center;gap:10px;font-size:13px;color:color-mix(in srgb,var(--brand-ink) 62%,transparent)">
    <a href="Aljarmaq Home.dc.html">الرئيسية</a><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    <a href="Aljarmaq Home.dc.html">الوسوم</a><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    <span style="font-weight:600;color:var(--brand-ink)">مخططات هيكلية</span>
  </div>
  <section style="max-width:1400px;margin:0 auto;padding:0 var(--gut)">
    <div style="background:var(--brand-ink);color:#f4f3f1;padding:40px 36px;margin-top:22px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:26px">
      <div>
        <span style="font-size:12px;font-weight:700;color:var(--brand-amber)">وسم متابَع</span>
        <h1 style="color:#fff;font-size:clamp(30px,4vw,52px);margin-top:10px">#مخططات_هيكلية</h1>
        <p style="margin:14px 0 0;font-size:16px;line-height:1.8;max-width:54ch;opacity:.78">كل ما نشره الجرمق عن المخططات الهيكلية في البلدات العربية: الإيداع، الاعتراضات، وقرارات اللجان.</p>
      </div>
      <div style="display:flex;gap:32px">
        <div><div class="lat" style="font-size:34px;line-height:1;color:var(--brand-amber)">86</div><div style="font-size:12.5px;opacity:.7;margin-top:4px">مادة</div></div>
        <div><div class="lat" style="font-size:34px;line-height:1;color:var(--brand-amber)">12</div><div style="font-size:12.5px;opacity:.7;margin-top:4px">تحقيق</div></div>
        <div><div class="lat" style="font-size:34px;line-height:1;color:var(--brand-amber)">4</div><div style="font-size:12.5px;opacity:.7;margin-top:4px">ملفات مفتوحة</div></div>
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;padding:26px 0 30px;border-bottom:2px solid var(--rule)">
      <span style="font-size:13px;font-weight:700;padding:7px 0 7px">وسوم قريبة:</span>
      <sc-for list="{{ near }}" as="t" hint-placeholder-count="6">
        <a href="Aljarmaq Tag.dc.html" style="border:1px solid color-mix(in srgb,var(--brand-ink) 28%,transparent);padding:7px 13px;font-size:13px;font-weight:600" style-hover="background:var(--brand-ink);color:var(--paper);border-color:var(--brand-ink)">{{ t }}</a>
      </sc-for>
    </div>
    <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:16px 0">
      <div style="display:flex;gap:2px">
        <sc-for list="{{ sortTabs }}" as="s" hint-placeholder-count="3">
          <button onClick="{{ s.on }}" style="border:1px solid color-mix(in srgb,var(--brand-ink) 25%,transparent);background:{{ s.bg }};color:{{ s.fg }};font-family:var(--font-ar);font-size:13px;font-weight:600;padding:9px 15px;cursor:pointer">{{ s.label }}</button>
        </sc-for>
      </div>
      <label style="display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600">
        <span style="color:color-mix(in srgb,var(--brand-ink) 60%,transparent)">الفترة</span>
        <select value="{{ period }}" onChange="{{ setPeriod }}" style="font-family:var(--font-ar);font-size:13.5px;font-weight:600;padding:9px 14px 9px 36px;border:1px solid color-mix(in srgb,var(--brand-ink) 30%,transparent);color:var(--brand-ink);outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;background-color:#fff;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2216%22%20height%3D%2216%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23232f47%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m6%209%206%206%206-6%22%2F%3E%3C%2Fsvg%3E');background-repeat:no-repeat;background-position:left 12px center">
          <sc-for list="{{ periodOpts }}" as="o" hint-placeholder-count="3"><option value="{{ o }}">{{ o }}</option></sc-for>
        </select>
      </label>
    </div>
    <div data-g="g3" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:var(--rule);margin-top:2px">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="6">
        <a href="Aljarmaq Article.dc.html" style="background:var(--paper);display:flex;flex-direction:column;gap:0" style-hover="background:var(--paper-2)">
          <div style="aspect-ratio:16/10;overflow:hidden"><img src="{{ c.img }}" alt="" style="width:100%;height:100%;object-fit:cover"></div>
          <div style="padding:20px 22px 24px;display:flex;flex-direction:column;gap:10px;flex:1">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span style="font-size:11.5px;font-weight:700;color:var(--brand-amber-deep)">{{ c.cat }}</span><span class="lat" style="font-size:11px;opacity:.55">{{ c.time }}</span></div>
            <h3 style="font-size:19px;line-height:1.45">{{ c.title }}</h3>
            <p style="margin:0;font-size:14px;line-height:1.7;color:color-mix(in srgb,var(--brand-ink) 66%,transparent)">{{ c.ex }}</p>
          </div>
        </a>
      </sc-for>
    </div>
  </section>
  <div style="max-width:1400px;margin:44px auto 72px;padding:0 var(--gut);display:flex;align-items:center;justify-content:center;gap:2px">
    <a href="#top" style="width:44px;height:44px;border:2px solid var(--rule);display:grid;place-items:center" style-hover="background:var(--brand-ink);color:var(--paper)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
    <a href="#top" class="lat" style="width:44px;height:44px;border:2px solid var(--rule);display:grid;place-items:center;background:var(--brand-ink);color:var(--paper)">1</a>
    <a href="#top" class="lat" style="width:44px;height:44px;border:2px solid var(--rule);display:grid;place-items:center" style-hover="background:var(--brand-ink);color:var(--paper)">2</a>
    <a href="#top" class="lat" style="width:44px;height:44px;border:2px solid var(--rule);display:grid;place-items:center" style-hover="background:var(--brand-ink);color:var(--paper)">3</a>
    <span class="lat" style="width:34px;text-align:center;opacity:.5">…</span>
    <a href="#top" class="lat" style="width:44px;height:44px;border:2px solid var(--rule);display:grid;place-items:center" style-hover="background:var(--brand-ink);color:var(--paper)">18</a>
    <a href="#top" style="width:44px;height:44px;border:2px solid var(--rule);display:grid;place-items:center;transform:scaleX(-1)" style-hover="background:var(--brand-ink);color:var(--paper)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
  </div>
<dc-import name="Site Footer" hint-size="100%,520px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { sort: 0, period: 'كل الوقت' };
  renderVals() {
    const P = (f) => 'https://commons.wikimedia.org/wiki/Special:FilePath/' + f + '?width=1400';
    const pool = [
      { img: 'https://commons.wikimedia.org/wiki/Special:FilePath/PikiWiki_Israel_32275_Shaab_in_Lower_Galilee.jpg?width=1400', cat: 'محليات', time: '14:20', author: 'رنا خطيب', title: 'جلسة استماع في لجنة التخطيط تنتهي دون قرار بشأن مخطط عرابة', ex: 'أصحاب الأراضي قدّموا 47 اعتراضًا، واللجنة أعطت مهلة شهرين لاستكمال المستندات.' },
      { img: 'https://commons.wikimedia.org/wiki/Special:FilePath/2011-08_Nazaret_Geb%C3%A4ude.jpg?width=1400', cat: 'تعليم', time: '12:55', author: 'وليد الأسدي', title: 'ميزانية الترميم تصل 14 مدرسة فقط من أصل 40 طلبًا', ex: 'وثائق الوزارة تكشف أن معايير التوزيع تغيّرت مرتين خلال السنة المالية.' },
      { img: 'https://commons.wikimedia.org/wiki/Special:FilePath/White_Mosque_Nazareth_017.JPG?width=1400', cat: 'اقتصاد', time: '11:30', author: 'أمير حجازي', title: 'أسعار الخضار ترتفع 18% خلال أسبوعين والتجار يحمّلون النقل المسؤولية', ex: 'جولة في أسواق الجليل ترصد فروقات تصل إلى 4 شواقل للكيلو بين بلدة وأخرى.' },
      { img: 'https://commons.wikimedia.org/wiki/Special:FilePath/Nazarets_Stadtpanorama_(3786331918).jpg?width=1400', cat: 'رياضة', time: '10:15', author: 'محمود زيدان', title: 'أبناء سخنين يستعد للموسم بمعسكر مغلق وثلاث صفقات جديدة', ex: 'الإدارة تعوّل على الجمهور لتغطية ثلث ميزانية الموسم القادم.' },
      { img: 'https://commons.wikimedia.org/wiki/Special:FilePath/114265_alkosh_in_the_upper_galilee_PikiWiki_Israel.jpg?width=1400', cat: 'ثقافة', time: '09:40', author: 'ليان صالح', title: 'مهرجان حيفا للأفلام العربية يفتح باب التسجيل لدورته الحادية عشرة', ex: 'أكثر من 200 فيلم تقدّم العام الماضي، ونصفها من إنتاج مستقل.' },
      { img: 'https://commons.wikimedia.org/wiki/Special:FilePath/116990_birya_in_the_upper_galilee_PikiWiki_Israel.jpg?width=1400', cat: 'صحة', time: '08:50', author: 'هدى مصاروة', title: 'عيادة متنقلة تصل عشر قرى في النقب بعد سنوات من المطالبات', ex: 'الخدمة تعمل ثلاثة أيام أسبوعيًا وتغطي فحوصات السكري والضغط.' },
      { img: 'https://commons.wikimedia.org/wiki/Special:FilePath/PikiWiki_Israel_28738_Mount_of_Precipice.JPG?width=1400', cat: 'محليات', time: '07:45', author: 'سائد عابد', title: 'انقطاع المياه عن حيّين في شفاعمرو يفتح ملف الشبكة القديمة', ex: 'المجلس يقول إن استبدال الأنابيب يحتاج 12 مليون شيكل.' },
      { img: 'https://commons.wikimedia.org/wiki/Special:FilePath/Olive_harvesting.jpg?width=1400', cat: 'اقتصاد', time: '06:30', author: 'نبيل حداد', title: 'صندوق جديد يستهدف الشركات الناشئة في البلدات العربية', ex: 'التمويل الأولي 40 مليون شيكل، والأولوية للمشاريع في الشمال.' }
    ];
    const sorts = ['الأحدث', 'الأكثر قراءة', 'الأهم'];
    return {
      sortTabs: sorts.map((label, i) => ({ label, on: () => this.setState({ sort: i }), bg: i === this.state.sort ? 'var(--brand-ink)' : 'transparent', fg: i === this.state.sort ? 'var(--paper)' : 'var(--brand-ink)' })),
      periodOpts: ['كل الوقت', 'هذا الشهر', 'هذه السنة', '2025', '2024'],
      period: this.state.period,
      setPeriod: (e) => this.setState({ period: e.target.value }),
      cards: pool.slice(0, 6), near: ['اللجنة اللوائية', 'أراضٍ زراعية', 'حق السكن', 'الجليل الأسفل', 'إخطارات هدم', 'النقب'] };
  }
}
</script>
</body>
</html>
